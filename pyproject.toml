[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nix_adapter"
version = "0.2.0"
description = "Cross-platform native reconciliation adapter and CLI primitives for Nix deployments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "tomli-w",
]

[project.scripts]
progress-renderer = "nix_adapter.progress:main"

[project.urls]
Source = "https://github.com/gin31259461/nix-adapter"
